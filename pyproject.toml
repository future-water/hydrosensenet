[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrosensenet"
version = "0.1.1"
description = "An Open-Source Python Package for Optimal Hydrological Monitoring Network Design"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Jeil Oh"},
    {name = "John Lee"},
    {name = "Matthew Bartos"}
]
keywords = ["hydrology", "sensor networks", "streamgauge", "optimization", "QR decomposition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "xarray>=0.19.0",
    "geopandas>=0.10.0",
    "cartopy>=0.20.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "shapely>=1.8.0",
    "rioxarray>=0.8.0",
    "pyarrow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "sphinx>=4.0.0",
]
nwm = [
    "fsspec>=2021.11.0",
    "dask[distributed]>=2021.11.0",
    "pynhd>=0.14.0",
    "s3fs>=2021.11.0",
    "zarr>=2.10.0",
]


[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
