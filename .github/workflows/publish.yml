name: Publish to PyPI

# Publishes when a GitHub release is published.
# Uses PyPI trusted publishing (no API token needed):
# configure this repo + workflow at
# https://pypi.org/manage/account/publishing/ first.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' hydrosensenet/__init__.py)"
          if [ -z "$version" ]; then
            echo "Could not parse __version__ from hydrosensenet/__init__.py" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' (-> '$tag') does not match hydrosensenet.__version__ '$version'." >&2
            exit 1
          fi
          echo "Release tag matches package version $version."

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
